<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./css/style.css">
 
    <title>Calculando IMC</title>
</head>
<body>
    
    <header class="header">
        <h1 class="title">Calculando IMC</h1>
        <p class="subtitle">Descubra seu Índice de Massa Corporal</p>
    </header>    

    <main>
        <div id="imc-form">
            <p>
                <label for="input-peso">O seu peso (kg)</label><br />
                <input id="input-peso" type="number" value="70" step="0.1">
            </p>

            <p>
                <label for="input-altura">A sua altura (m)</label><br />
                <input id="input-altura" type="number" value="1.79" step="0.01">
            </p>

            <!--<button id="button-calcular-imc">Calcular IMC</button>-->

            
            <p id="result">
                <span class="result-label">Seu IMC</span>
                <strong id="imc-result"></strong>
                <span id="result-status"></span>
            </p>
        </div>

        <div id="imc-output">
            
            <div id="imc-img"></div>
        </div>
    </main>


    <script defer src="./js/script.js"></script>
</body>
</html>
